[project]
name = "pyalex"
description = "Python interface to the OpenAlex database"
authors = [
    { name = "Jonathan de Bruin", email = "jonathandebruinos@gmail.com" }
]
maintainers = [
    { name = "Yousa-Mirage" }
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed"
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx2>=2.16"
]
dynamic = ["version"]
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/Yousa-Mirage/pyalex"
Issues = "https://github.com/Yousa-Mirage/pyalex/issues"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "python-dotenv>=1.0",
]
dev = [
    { include-group = "test" },
    "ruff==0.17.3",
    "ty==0.0.94"
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "setuptools-scm>=8"]

[tool.setuptools]
packages = ["pyalex"]

[tool.setuptools.package-data]
pyalex = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PT"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unused-ignore-comment = "error"
invalid-ignore-comment = "error"
missing-override-decorator = "error"
redundant-cast = "warn"
possibly-missing-attribute = "warn"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v -W error"
